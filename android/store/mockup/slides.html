<!doctype html>
<html><head><meta charset="utf-8"><title>Slide</title>
<link rel="preload" href="../../../app/fonts/InterDisplay-Bold.otf" as="font" crossorigin>
<link rel="preload" href="../../../app/fonts/Inter-Regular.otf" as="font" crossorigin>
<link rel="preload" href="../../../app/fonts/Inter-SemiBold.otf" as="font" crossorigin>
<style>
  @font-face { font-family: "InterDisplay"; src: url("../../../app/fonts/InterDisplay-Bold.otf"); font-weight: 700; }
  @font-face { font-family: "InterDisplay"; src: url("../../../app/fonts/InterDisplay-Black.otf"); font-weight: 900; }
  @font-face { font-family: "Inter"; src: url("../../../app/fonts/Inter-Regular.otf"); font-weight: 400; }
  @font-face { font-family: "Inter"; src: url("../../../app/fonts/Inter-SemiBold.otf"); font-weight: 600; }
  :root { --gold: #c9a04a; --fg: #f4f1ea; --dim: #a39f97; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0c; }
  .slide { position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(ellipse 900px 700px at 50% 0%, rgba(201,160,74,.20), transparent 70%), #0b0b0c; }
  .head { position: absolute; top: 120px; left: 80px; right: 80px; text-align: center; }
  h1 { margin: 0; font: 700 86px/1.06 "InterDisplay", sans-serif; color: var(--fg); letter-spacing: -1.5px; }
  h1 em { font-style: normal; color: var(--gold); }
  .sub { margin-top: 26px; font: 400 40px/1.3 "Inter", sans-serif; color: var(--dim); }
  .plus { display: inline-block; margin-top: 30px; padding: 10px 26px; border-radius: 99px; border: 2px solid var(--gold);
    font: 600 30px "Inter", sans-serif; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; }
  .phone { position: absolute; left: 50%; transform: translateX(-50%); width: 820px; height: 1458px; border-radius: 74px;
    padding: 18px; background: #1b1b1e; box-shadow: 0 0 0 3px #2c2c31, 0 50px 120px rgba(0,0,0,.75); }
  .phone img { width: 820px; height: 1458px; border-radius: 58px; display: block; object-fit: cover; object-position: top; }
  /* the last one: the PC window with the phone beside it */
  .pc { position: absolute; top: 640px; left: 60px; width: 960px; }
  .pc .screen { width: 960px; height: 600px; border-radius: 22px; padding: 16px; background: #1b1b1e; box-shadow: 0 0 0 3px #2c2c31, 0 40px 100px rgba(0,0,0,.7); }
  .pc .screen img { width: 960px; height: 600px; border-radius: 10px; display: block; object-fit: cover; }
  .pc .stand { width: 220px; height: 90px; margin: 0 auto; background: linear-gradient(#232327, #151518); clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%); }
  .pc .base { width: 420px; height: 16px; margin: 0 auto; border-radius: 8px; background: #232327; }
  .phone.small { width: 400px; height: 711px; border-radius: 44px; padding: 12px; left: auto; right: 70px; top: 1060px; transform: none; }
  .phone.small img { width: 400px; height: 711px; border-radius: 34px; }
</style></head><body>
<script>
const S = "out/screens/";
const SLIDES = {
  1: { h: `Your <em>vinyl*</em><br>listening companion`, sub: "*or CD, cassette, or radio", img: "main" },
  2: { h: "Names the song<br>as it plays", img: "recognized" },
  3: { h: "Lyrics that scroll<br>with the song", plus: true, img: "lyrics" },
  4: { h: "The band's story<br>and every credit", plus: true, img: "info" },
  5: { h: "Follows the side.<br>Tells you when to flip.", img: "tracklist" },
  6: { h: "Every record<br>you've played", plus: true, img: "shelf" },
  7: { h: "Works on its own<br>or with your PC", pc: true },
};
const n = new URLSearchParams(location.search).get("n") || "1";
const s = SLIDES[n];
const head = `<div class="head"><h1>${s.h}</h1>${s.sub ? `<div class="sub">${s.sub}</div>` : ""}${s.plus ? `<div class="plus">Plus</div>` : ""}</div>`;
const phoneTop = s.sub || s.plus ? 560 : 500;
const body = s.pc
  ? `<div class="pc"><div class="screen"><img src="${S}pc.png"></div><div class="stand"></div><div class="base"></div></div>
     <div class="phone small"><img src="${S}main.png"></div>`
  : `<div class="phone" style="top:${phoneTop}px"><img src="${S}${s.img}.png"></div>`;
document.body.innerHTML = `<div class="slide">${head}${body}</div>`;
</script>
</body></html>
