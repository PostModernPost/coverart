name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "app/**", "VERSION", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The phone runs the same Python engine as the Windows app (Chaquopy builds it with this Python)
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Engine files
        env:
          DISCOGS_KEY: ${{ secrets.DISCOGS_KEY }}
          DISCOGS_SECRET: ${{ secrets.DISCOGS_SECRET }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          python packaging/write_secrets.py
          echo "CHAQUOPY_BUILD_PYTHON=${{ steps.py.outputs.python-path }}" >> "$GITHUB_ENV"
          # aiohttp and its helpers as plain-Python wheels (their compiled parts aren't built for Android)
          AIOHTTP_NO_EXTENSIONS=1 MULTIDICT_NO_EXTENSIONS=1 YARL_NO_EXTENSIONS=1 FROZENLIST_NO_EXTENSIONS=1 PROPCACHE_NO_EXTENSIONS=1 \
            python -m pip wheel --no-binary aiohttp,multidict,yarl,frozenlist,propcache aiohttp -w android/wheels
          ls android/wheels
          for w in android/wheels/*.whl; do case "$w" in *-none-any.whl) ;; *) echo "::error::not a plain-Python wheel: $w"; exit 1;; esac; done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Upload key
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          tasks="assembleDirectDebug"
          if [ "$HAS_KEY" = "true" ]; then tasks="assembleDirectRelease bundlePlayRelease"; fi
          if ! gradle -p android $tasks --no-daemon --stacktrace 2>&1 | tee build.log; then
            # Compile errors as annotations, so they're readable without the full log
            grep -E "^e: |error:|What went wrong|Could not |Failed to |> " build.log | head -40 | while read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: liner-notes-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab

      - name: Attach to the release
        if: env.HAS_KEY == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat VERSION | tr -d '[:space:]')
          # the Windows build publishes the release; wait for it (up to 15 minutes)
          for i in $(seq 1 90); do
            if gh release view "v$v" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          if ! gh release view "v$v" >/dev/null 2>&1; then echo "::warning::No release v$v to attach the app to"; exit 0; fi
          # the GitHub copy (updates itself) under two names: one per version, and one that's always the latest
          cp android/app/build/outputs/apk/direct/release/app-direct-release.apk "LinerNotes-Android-$v.apk"
          cp android/app/build/outputs/apk/direct/release/app-direct-release.apk "LinerNotes-Android.apk"
          # the Play Store copy
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab "LinerNotes-Android-$v.aab"
          gh release upload "v$v" "LinerNotes-Android-$v.apk" "LinerNotes-Android.apk" "LinerNotes-Android-$v.aab" --clobber
