name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt pyinstaller

      - name: Version number
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.TrimStart("v") }
          else { $v = "0.1.$env:GITHUB_RUN_NUMBER" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Icon
        run: python packaging/make_icon.py

      - name: Bundle the app
        run: >
          pyinstaller --noconfirm --windowed --name CoverArt
          --icon packaging/coverart.ico
          --paths app
          --add-data "app/display.html;."
          --hidden-import core
          --hidden-import pystray._win32
          --collect-all shazamio
          --collect-all shazamio_core
          --collect-all winrt
          --collect-all _sounddevice_data
          app/main.py

      - name: Self-test (every bundled part loads)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\CoverArt\CoverArt.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\Cover Art\selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=$env:VERSION packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: CoverArt-Setup-${{ env.VERSION }}
          path: dist/CoverArt-Setup-*.exe

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CoverArt-Setup-*.exe
