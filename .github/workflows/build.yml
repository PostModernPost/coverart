name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Code signing turns on automatically once these secrets exist (see SIGNING.md)
      # (all of them, so adding some early doesn't break releases)
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_SIGNING_ENDPOINT != '' && secrets.AZURE_SIGNING_ACCOUNT != '' && secrets.AZURE_SIGNING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt pyinstaller

      # Releasing = raising the number in the VERSION file on main. If no release exists for that
      # number yet, this build becomes it. Otherwise it's a test build numbered 0.0.<run>.
      - name: Version number
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $file = (Get-Content VERSION -Raw).Trim()
          $release = "false"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.TrimStart("v"); $release = "true" }
          elseif ($env:GITHUB_REF -eq "refs/heads/main") {
            gh release view "v$file" --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) { $v = $file; $release = "true" } else { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
            $global:LASTEXITCODE = 0
          }
          else { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE=$release" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION = `"$v`"" | Out-File -FilePath app\_version.py -Encoding utf8

      - name: App keys
        shell: pwsh
        env:
          DISCOGS_KEY: ${{ secrets.DISCOGS_KEY }}
          DISCOGS_SECRET: ${{ secrets.DISCOGS_SECRET }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          if ($env:LASTFM_KEY -and $env:LASTFM_SECRET) { "Last.fm key: included" } else { "::warning::No Last.fm key: scrobbling will be unavailable" }
          if ($env:DISCOGS_KEY -and $env:DISCOGS_SECRET) { "Discogs key: included" } else { "::warning::No Discogs key: record search will ask users for a token" }
          if ($env:SPOTIFY_CLIENT_ID) { "Spotify app: included" } else { "::warning::No Spotify client ID: people will need their own Spotify app to save to Spotify" }
          python packaging/write_secrets.py
          python -c "import sys; sys.path.insert(0, 'app'); import _secrets"

      - name: Icon
        run: python packaging/make_icon.py

      - name: Bundle the app
        run: >
          pyinstaller --noconfirm --windowed --name LinerNotes
          --icon packaging/linernotes.ico
          --paths app
          --add-data "app/display.html;."
          --add-data "app/fonts;fonts"
          --hidden-import core
          --hidden-import recap
          --hidden-import logo
          --hidden-import _version
          --hidden-import _secrets
          --hidden-import pystray._win32
          --collect-all shazamio
          --collect-all shazamio_core
          --collect-all winrt
          --collect-all _sounddevice_data
          --collect-all webview
          --hidden-import clr
          --collect-submodules qrcode
          app/main.py

      - name: Self-test (every bundled part loads)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LinerNotes\LinerNotes.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\Liner Notes\selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Check the signing setup
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          T: ${{ secrets.AZURE_TENANT_ID }}
          C: ${{ secrets.AZURE_CLIENT_ID }}
          S: ${{ secrets.AZURE_CLIENT_SECRET }}
          E: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          A: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          P: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          # Reports problems as annotations (readable without the full log). Never prints the values.
          $ok = $true
          if ($env:E -notmatch '^https://[a-z0-9]+\.codesigning\.azure\.net/?$') { Write-Output "::error::AZURE_SIGNING_ENDPOINT should look like https://wus2.codesigning.azure.net/ (it doesn't)"; $ok = $false }
          if ($env:T -notmatch '^[0-9a-fA-F-]{36}$') { Write-Output "::error::AZURE_TENANT_ID isn't a GUID"; $ok = $false }
          if ($env:C -notmatch '^[0-9a-fA-F-]{36}$') { Write-Output "::error::AZURE_CLIENT_ID isn't a GUID"; $ok = $false }
          if ($env:S -match '^[0-9a-fA-F-]{36}$') { Write-Output "::error::AZURE_CLIENT_SECRET looks like the Secret ID, not the secret's Value"; $ok = $false }
          try {
            $tok = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$($env:T)/oauth2/v2.0/token" -Body @{
              grant_type = "client_credentials"; client_id = $env:C; client_secret = $env:S; scope = "https://codesigning.azure.net/.default" }
            Write-Output "::notice::Signed in to Azure as the app"
          } catch {
            $m = $_.ErrorDetails.Message; if (-not $m) { $m = $_.Exception.Message }
            $code = ([regex]::Match($m, 'AADSTS\d+')).Value
            Write-Output "::error::Azure sign-in failed ($code). Check tenant ID, client ID and client secret."
            exit 1
          }
          $digest = [Convert]::ToBase64String((New-Object byte[] 32))
          $u = "$($env:E.TrimEnd('/'))/codesigningaccounts/$($env:A)/certificateprofiles/$($env:P)/sign?api-version=2022-06-15-preview"
          try {
            $r = Invoke-WebRequest -Method Post -Uri $u -Headers @{ Authorization = "Bearer $($tok.access_token)" } -ContentType "application/json" -Body (@{ signatureAlgorithm = "RS256"; digest = $digest } | ConvertTo-Json)
            Write-Output "::notice::Signing service answered $($r.StatusCode): the account, profile and role are all right"
          } catch {
            $st = $_.Exception.Response.StatusCode.value__
            $hint = @{ 401 = "sign-in token refused"; 403 = "the app lacks the 'Artifact Signing Certificate Profile Signer' role on the signing account (or it hasn't taken effect yet)"; 404 = "account or profile name not found at that endpoint (wrong name, or wrong region in the endpoint)" }[$st]
            Write-Output "::error::Signing service said $st : $hint"
            exit 1
          }

      - name: Sign the app
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\LinerNotes
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=$env:VERSION packaging\installer.iss
          # the same installer under a name that never changes, for the website's download link
          Copy-Item "dist\LinerNotes-Setup-$env:VERSION.exe" "dist\LinerNotes-Setup.exe"

      - name: Sign the installer
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: LinerNotes-Setup-${{ env.VERSION }}
          path: dist/LinerNotes-Setup-*.exe

      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Liner Notes ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          files: dist/LinerNotes-Setup*.exe
